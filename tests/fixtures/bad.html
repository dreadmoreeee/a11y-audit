<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { scroll-behavior: smooth; }
  body { font-family: sans-serif; margin: 0; padding: 8px; }
  a, button { outline: none; }
  .ghost { position: absolute; left: -9999px; top: 0; }
  .low { color: #bbb; background: #fff; }
  .box { width: 220px; height: 40px; overflow: hidden; font-size: 16px; line-height: 20px; border: 1px solid #999; }
  .wide { white-space: nowrap; font-size: 16px; }
  .spin { display: inline-block; animation: spin 2s linear infinite; }
  .card { transition: transform 0.6s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<a class="ghost" href="#main">Hidden skip link that never appears</a>
<a href="#a">First link</a>
<a href="#b">Second link</a>
<button type="button">Plain button</button>
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10">
<p class="low">Low contrast text that is hard to read.</p>
<input type="text">
<button type="button"></button>
<div class="box">Two lines of text fit in this box at normal size only.</div>
<p class="wide">This single line never wraps and is roughly nine hundred pixels wide at normal size so it overflows at 200%.</p>
<span class="spin">*</span>
<div class="card">Card that moves on hover.</div>
</body>
</html>
